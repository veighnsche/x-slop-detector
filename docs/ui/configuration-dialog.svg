<svg xmlns="http://www.w3.org/2000/svg" width="420" height="652" viewBox="0 0 420 652" fill="none">
  <title>X Slop Detector — configuration dialog concept</title>
  <desc>A compact configuration dialog opened by the control panel cogwheel, with server URL, masked API token, connection test, read-only detector information, and Save and Cancel buttons. Static mockup with a reserved example domain and no credentials.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1220" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="420" height="652" rx="20" fill="#EDEFEF"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="30" y="32" font-size="11" font-weight="650" letter-spacing="1.5" fill="#64716E">02 / CLICK THE COGWHEEL</text>
    <text x="30" y="61" font-size="12" fill="#64716E">Configuration opens in the same popup.</text>
    <g filter="url(#shadow)">
      <rect x="30" y="83" width="360" height="516" rx="14" fill="#151C19"/>
      <rect x="30.5" y="83.5" width="359" height="515" rx="13.5" stroke="#2B3831"/>
    </g>
    <text x="50" y="122" font-size="16" font-weight="650" fill="#F1F5F2">Configuration</text>
    <rect x="342" y="101" width="32" height="32" rx="8" fill="#243029"/>
    <path d="m354 113 8 8m0-8-8 8" stroke="#C4D1C8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M50 148h320" stroke="#2B3831"/>
    <text x="50" y="175" font-size="10.5" font-weight="650" letter-spacing="1.3" fill="#8FA397">YOUR DETECTOR SERVER</text>
    <text x="50" y="207" font-size="12" font-weight="550" fill="#DCE7DF">Server URL</text>
    <rect x="50" y="217" width="320" height="39" rx="7" fill="#1C2721" stroke="#415648"/>
    <text x="62" y="241" font-size="12" fill="#E0EAE3">https://detector.example.com</text>
    <text x="50" y="278" font-size="12" font-weight="550" fill="#DCE7DF">API token</text>
    <rect x="50" y="288" width="320" height="39" rx="7" fill="#1C2721" stroke="#415648"/>
    <text x="63" y="315" font-size="19" letter-spacing="2" fill="#C4D1C8">••••••••••••••••</text>
    <path d="M341 307c3-4 7-6 10-6s7 2 10 6c-3 4-7 6-10 6s-7-2-10-6Z" stroke="#8FA397" stroke-width="1.3"/>
    <circle cx="351" cy="307" r="2.5" stroke="#8FA397" stroke-width="1.3"/>
    <text x="50" y="346" font-size="11" fill="#8FA397">Kept on this device. Not synced.</text>
    <rect x="50" y="363" width="144" height="33" rx="7" fill="#243029" stroke="#3A4C40"/>
    <path d="m63 379 4 4 7-8" stroke="#B9F5CF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="384" font-size="11.5" font-weight="600" text-anchor="middle" fill="#E0EAE3">Test connection</text>
    <circle cx="284" cy="380" r="3" fill="#8FA397"/>
    <text x="295" y="384" font-size="11" fill="#A2B2A7">Not tested</text>
    <path d="M50 415h320" stroke="#2B3831"/>
    <text x="50" y="439" font-size="10.5" font-weight="650" letter-spacing="1.3" fill="#8FA397">SERVER-MANAGED</text>
    <text x="50" y="465" font-size="12" fill="#A2B2A7">Detector</text>
    <text x="370" y="465" font-size="12" text-anchor="end" fill="#DCE7DF">Tabularis ModernBERT</text>
    <text x="50" y="488" font-size="12" fill="#A2B2A7">GPU / idle timeout</text>
    <text x="370" y="488" font-size="12" text-anchor="end" fill="#DCE7DF">RTX 3060 / 10 min</text>
    <text x="50" y="515" font-size="11" fill="#8FA397">Post text is sent to your configured server.</text>
    <path d="M50 533h320" stroke="#2B3831"/>
    <rect x="50" y="549" width="154" height="34" rx="7" fill="#243029" stroke="#3A4C40"/>
    <text x="127" y="571" font-size="12" font-weight="600" text-anchor="middle" fill="#E0EAE3">Cancel</text>
    <rect x="216" y="549" width="154" height="34" rx="7" fill="#B9F5CF"/>
    <text x="293" y="571" font-size="12" font-weight="650" text-anchor="middle" fill="#173123">Save</text>
    <text x="30" y="628" font-size="11" fill="#64716E">360 px wide · no new tab or dashboard</text>
  </g>
</svg>
