<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" fill="none">
  <title>X Slop Detector — extension control panel concept</title>
  <desc>A compact dark Chrome extension popup with model status, load and unload buttons, automatic scanning, and a configuration cogwheel. Static design mockup, not a working extension.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1220" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="420" height="500" rx="20" fill="#EDEFEF"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="30" y="32" font-size="11" font-weight="650" letter-spacing="1.5" fill="#64716E">01 / CLICK THE EXTENSION ICON</text>
    <rect x="30" y="49" width="360" height="40" rx="10" fill="#DEE3E1"/>
    <rect x="44" y="61" width="249" height="15" rx="7.5" fill="#CDD5D2"/>
    <circle cx="311" cy="69" r="3" fill="#98A6A0"/>
    <rect x="340" y="55" width="28" height="28" rx="7" fill="#17231F"/>
    <path d="M347 74V64h4v10m4 0V64h5v10" stroke="#B9F5CF" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m348 99 6-6 6 6" fill="#151C19"/>
    <g filter="url(#shadow)">
      <rect x="30" y="99" width="360" height="352" rx="14" fill="#151C19"/>
      <rect x="30.5" y="99.5" width="359" height="351" rx="13.5" stroke="#2B3831"/>
    </g>
    <rect x="50" y="119" width="28" height="28" rx="8" fill="#2C4436"/>
    <path d="m57 137 4-9 4 9 4-9" stroke="#B9F5CF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="89" y="138" font-size="15" font-weight="650" fill="#F1F5F2">X Slop Detector</text>
    <rect x="342" y="117" width="32" height="32" rx="8" fill="#243029"/>
    <g transform="translate(358 133)" stroke="#C4D1C8" stroke-width="1.5" stroke-linecap="round">
      <circle r="5"/>
      <circle r="1.8"/>
      <path d="M0-9v2M0 7v2M-9 0h2M7 0h2M-6.4-6.4-5-5M5 5l1.4 1.4M-6.4 6.4-5 5M5-5l1.4-1.4"/>
    </g>
    <path d="M50 164h320" stroke="#2B3831"/>
    <circle cx="55" cy="188" r="4" fill="#A7E7BB"/>
    <text x="67" y="192" font-size="12" font-weight="550" fill="#C0E1CA">Connected</text>
    <rect x="294" y="178" width="76" height="21" rx="10.5" fill="#293C30"/>
    <text x="332" y="192" font-size="10.5" font-weight="650" text-anchor="middle" fill="#B9F5CF">LOADED</text>
    <text x="50" y="224" font-size="17" font-weight="600" fill="#F1F5F2">Tabularis ModernBERT</text>
    <text x="50" y="246" font-size="12" fill="#A2B2A7">RTX 3060</text>
    <circle cx="118" cy="242" r="1.5" fill="#627569"/>
    <text x="130" y="246" font-size="12" fill="#A2B2A7">Unloads after 10 min idle</text>
    <rect x="50" y="265" width="154" height="38" rx="8" fill="#243029" stroke="#3A4C40"/>
    <path d="M69 285h12m-6-6v12" stroke="#D5E3D9" stroke-width="1.5" stroke-linecap="round"/>
    <text x="135" y="289" font-size="13" font-weight="600" text-anchor="middle" fill="#E0EAE3">Load</text>
    <rect x="216" y="265" width="154" height="38" rx="8" fill="#B9F5CF"/>
    <path d="M235 285h12" stroke="#173123" stroke-width="1.5" stroke-linecap="round"/>
    <text x="301" y="289" font-size="13" font-weight="650" text-anchor="middle" fill="#173123">Unload</text>
    <text x="50" y="324" font-size="11" fill="#8FA397">Unload also pauses scanning.</text>
    <path d="M50 343h320" stroke="#2B3831"/>
    <text x="50" y="369" font-size="13" font-weight="550" fill="#E0EAE3">Scan visible posts</text>
    <text x="50" y="389" font-size="11" fill="#8FA397">Only the post’s own text. Nothing hidden.</text>
    <rect x="332" y="354" width="38" height="22" rx="11" fill="#B9F5CF"/>
    <circle cx="359" cy="365" r="8" fill="#173123"/>
    <path d="M50 405h320" stroke="#2B3831"/>
    <circle cx="56" cy="428" r="5" stroke="#8FA397" stroke-width="1.2"/>
    <path d="M56 427v3m0-6v.1" stroke="#8FA397" stroke-width="1.2" stroke-linecap="round"/>
    <text x="70" y="432" font-size="11" fill="#9EAEA4">Experimental estimates, not proof.</text>
    <text x="30" y="478" font-size="11" fill="#64716E">360 px wide · status + quick controls</text>
  </g>
</svg>
