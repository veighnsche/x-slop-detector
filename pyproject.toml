[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-slop-detector-server"
version = "0.1.0"
description = "Self-hosted dedicated text detector with on-demand GPU residency"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
inference = [
    "torch>=2.6,<3",
    "transformers>=5.8,<6",
    "safetensors>=0.5,<1",
]
test = ["httpx>=0.27,<1"]
evaluation = [
    "numpy==2.3.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "pyarrow==21.0.0",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["detector_server*", "detector_eval*"]

[tool.setuptools.package-data]
detector_server = ["_vendor/*.LICENSE"]
